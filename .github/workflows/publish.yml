name: Publish
# Publishing a GitHub release for a v* tag publishes that version to npm. npm trusts this workflow
# (trusted publishing), so no npm token is stored anywhere and every version gets provenance.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      # A prerelease goes out under its own dist-tag (0.3.0-alpha.2 as alpha), so latest stays stable
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) tag=$(echo "${version#*-}" | cut -d. -f1) ;;
            *) tag=latest ;;
          esac
          npm publish --tag "$tag"
