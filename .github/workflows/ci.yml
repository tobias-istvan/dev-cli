name: Checks
# Pushes to branches with a PR are checked by the pull_request run, so a push only runs here on
# the branches PRs merge into. Otherwise every PR push would run the whole matrix twice.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.13.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
